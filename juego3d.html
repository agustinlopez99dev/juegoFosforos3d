<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Juego de los Fósforos 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Space+Grotesk:wght@500;700&family=Creepster&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
    :root {
        --amber: #fbbf24;
        --red: #f87171;
        --blue: #60a5fa;
        --green: #34d399;
        --panel: linear-gradient(160deg, rgba(51,65,85,.62), rgba(15,23,42,.82));
        --line: rgba(148,163,184,.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07070b; color: #f8fafc;
        font-family: 'Outfit', sans-serif; user-select: none; -webkit-user-select: none; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); }
    .hud { position: fixed; z-index: 5; }

    /* Título */
    #title { top: 14px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
    #title h1 { margin: 0; font: 700 clamp(18px, 3vw, 30px) 'Space Grotesk', sans-serif; letter-spacing: .08em;
        background: linear-gradient(90deg, #fbbf24, #f97316, #ef4444); -webkit-background-clip: text; background-clip: text;
        color: transparent; filter: drop-shadow(0 0 14px rgba(249,115,22,.45)); }
    #title p { margin: 2px 0 0; font-size: 11px; color: #94a3b8; }

    /* Configuración */
    #config { top: 14px; left: 14px; width: 232px; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: #cbd5e1; }
    .row input, .row select { background: #0f172a; color: var(--amber); font: 700 13px 'Space Grotesk', sans-serif;
        border: 1px solid #475569; border-radius: 6px; padding: 4px 6px; outline: none; }
    .row input { width: 62px; text-align: center; }
    .row select { color: #e2e8f0; font-size: 12px; }
    .row input:focus, .row select:focus { border-color: var(--amber); }
    .seg { display: flex; gap: 3px; background: rgba(15,23,42,.9); border: 1px solid #334155; border-radius: 8px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: #94a3b8; font: 600 12px 'Outfit', sans-serif;
        padding: 4px 8px; border-radius: 6px; cursor: pointer; transition: .15s; }
    .seg button:hover { color: #fff; }
    .seg button.on { background: var(--amber); color: #0b1120; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .btn-main { border: 0; cursor: pointer; width: 100%; padding: 9px; border-radius: 9px; font: 800 12px 'Outfit', sans-serif;
        text-transform: uppercase; letter-spacing: .08em; color: #0b1120;
        background: linear-gradient(90deg, #f59e0b, #ea580c); transition: transform .12s, filter .2s; }
    .btn-main:hover { filter: brightness(1.12); }
    .btn-main:active { transform: scale(.96); }

    /* Estado */
    #status { top: 14px; right: 14px; width: 220px; padding: 12px; text-align: center; transition: border-color .3s, box-shadow .3s; }
    #status small { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    #turnBadge { margin-top: 3px; font: 700 20px 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #subTurn { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    #remainingRow { margin: 10px 0 6px; display: flex; align-items: baseline; justify-content: center; gap: 4px; }
    #remainingCount { font: 700 44px 'Space Grotesk', sans-serif; color: var(--amber); text-shadow: 0 0 22px rgba(251,191,36,.55); line-height: 1; }
    #initialMax { font-size: 13px; color: #64748b; font-weight: 600; }
    #nodeBadge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 7px; border: 1px solid; }
    .node-p { color: #f87171; border-color: rgba(239,68,68,.5) !important; background: rgba(239,68,68,.1); }
    .node-n { color: #34d399; border-color: rgba(16,185,129,.5) !important; background: rgba(16,185,129,.1); }
    .glow-human { border-color: #3b82f6 !important; animation: glowB 2s infinite; }
    .glow-ai { border-color: #ef4444 !important; animation: glowR 2s infinite; }
    @keyframes glowB { 50% { box-shadow: 0 0 26px rgba(59,130,246,.8); } }
    @keyframes glowR { 50% { box-shadow: 0 0 26px rgba(239,68,68,.8); } }

    /* Historial */
    #logBox { bottom: 14px; right: 14px; width: 250px; height: 150px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    #logBox header { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #cbd5e1;
        border-bottom: 1px solid #334155; padding-bottom: 5px; }
    #gameLog { flex: 1; overflow-y: auto; font-size: 12px; color: #cbd5e1; display: flex; flex-direction: column; gap: 3px; padding-right: 4px; }
    #gameLog p { margin: 0; padding: 3px 0; border-bottom: 1px solid rgba(51,65,85,.5); display: flex; justify-content: space-between; animation: slideIn .3s ease-out; }
    #gameLog p.empty { color: #64748b; font-style: italic; justify-content: center; }
    #gameLog::-webkit-scrollbar { width: 5px; } #gameLog::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

    /* Acciones */
    #actions { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #hint { font-size: 13px; color: #e2e8f0; padding: 6px 14px; border-radius: 999px; background: rgba(15,23,42,.7);
        border: 1px solid var(--line); backdrop-filter: blur(6px); text-align: center; max-width: 80vw; }
    #btns { display: flex; gap: 10px; }
    .key { border: 1px solid rgba(255,255,255,.15); cursor: pointer; color: #fff; font: 800 15px 'Outfit', sans-serif; letter-spacing: .04em;
        padding: 12px 24px; border-radius: 12px; background: linear-gradient(180deg, #64748b, #475569);
        box-shadow: 0 6px 0 #1e293b, 0 12px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
        transition: transform .12s, box-shadow .12s, background .2s; }
    .key.go { background: linear-gradient(180deg, #fbbf24, #d97706); color: #1c1003;
        box-shadow: 0 6px 0 #92400e, 0 12px 20px rgba(245,158,11,.3), inset 0 1px 0 rgba(255,255,255,.4); }
    .key:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.1); }
    .key:not(:disabled):active { transform: translateY(5px); box-shadow: 0 1px 0 #0f172a, 0 4px 8px rgba(0,0,0,.4); }
    .key:disabled { opacity: .4; cursor: not-allowed; transform: translateY(3px); box-shadow: 0 3px 0 #1e293b; }

    /* Modal */
    #modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: rgba(2,6,23,.78); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    #modalBox { width: 100%; max-width: 400px; text-align: center; padding: 28px; border-radius: 20px; border: 2px solid #334155;
        background: linear-gradient(160deg, #1e293b, #0f172a); box-shadow: 0 25px 60px rgba(0,0,0,.6), 0 0 40px rgba(251,146,60,.15);
        transform: scale(.9); transition: transform .3s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #modal.show #modalBox { transform: scale(1); }
    #resultIcon { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; border: 1px solid; }
    #resultTitle { margin: 0; font: 700 30px 'Space Grotesk', sans-serif; }
    #resultMsg { margin: 0; font-size: 14px; color: #cbd5e1; }

    #loading { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: #07070b;
        font: 600 16px 'Outfit', sans-serif; color: #94a3b8; transition: opacity .6s; }
    #loading.hide { opacity: 0; pointer-events: none; }

    /* Derrota */
    body.cine .hud { opacity: 0 !important; pointer-events: none; transition: opacity .8s; }
    #deathFlash { position: fixed; inset: 0; z-index: 79; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 50% 55%, rgba(255,40,10,.9), rgba(120,0,0,.85) 55%, #000 100%); }
    #death { position: fixed; inset: 0; z-index: 80; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 34px; opacity: 0; pointer-events: none; transition: opacity .6s; }
    #deathText { margin: 0; font: 400 clamp(56px, 13vw, 170px) 'Creepster', 'Space Grotesk', sans-serif; letter-spacing: .08em;
        color: #a30000; text-shadow: 0 0 24px rgba(255,0,0,.55), 0 0 70px rgba(150,0,0,.6);
        opacity: 0; transform: scale(1.12); transition: opacity 1.6s, transform 3s; }
    #deathText.show { opacity: 1; transform: scale(1); animation: dFlicker 3.2s infinite 1.6s; }
    @keyframes dFlicker { 0%,100% { opacity: 1; } 41% { opacity: 1; } 43% { opacity: .35; } 45% { opacity: 1; } 78% { opacity: .8; } 80% { opacity: 1; } }
    #deathBtn { width: auto; padding: 13px 30px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
    #deathBtn.show { opacity: 1; pointer-events: auto; }

    @media (max-width: 900px) {
        #config { width: 200px; padding: 9px; gap: 7px; }
        #status { width: 170px; padding: 9px; }
        #remainingCount { font-size: 34px; }
        #logBox { display: none; }
        #title { display: none; }
    }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="loading">Preparando la mesa…</div>

<div id="title" class="hud">
    <h1><i class="fa-solid fa-fire"></i> EL JUEGO DE LOS FÓSFOROS</h1>
    <p>IA con <b style="color:#fbbf24">Minimax</b> y nodos <b style="color:#34d399">N/P (Misère 4k+1)</b> · arrastrá para girar la cámara</p>
</div>

<div id="config" class="hud panel">
    <div class="row"><label for="cantInitialInput">Fósforos iniciales</label>
        <input type="number" id="cantInitialInput" min="5" max="300" value="21"></div>
    <div class="row"><label for="aiDifficulty">Nivel de la IA</label>
        <select id="aiDifficulty">
            <option value="easy">Fácil (50%)</option>
            <option value="medium" selected>Medio (20%)</option>
            <option value="hard">Difícil</option>
        </select></div>
    <div class="row"><span>Empieza</span>
        <div class="seg">
            <button id="btnStartAI" onclick="setFirstPlayer('ai')">IA</button>
            <button id="btnStartHuman" onclick="setFirstPlayer('human')">Vos</button>
            <button id="btnStartRandom" class="on" onclick="setFirstPlayer('random')">🎲 Azar</button>
        </div></div>
    <button class="btn-main" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i> Reiniciar</button>
</div>

<div id="status" class="hud panel">
    <small>Estado del turno</small>
    <div id="turnBadge"></div>
    <div id="subTurn"></div>
    <div id="remainingRow"><span id="remainingCount">21</span><span id="initialMax">/ 21</span></div>
    <span id="nodeBadge"></span>
</div>

<div id="logBox" class="hud panel">
    <header><i class="fa-solid fa-list-ul"></i> Historial de movimientos</header>
    <div id="gameLog"></div>
</div>

<div id="actions" class="hud">
    <div id="hint"></div>
    <div id="btns">
        <button id="btnClear" class="key" onclick="clearSelection()">Limpiar</button>
        <button id="btnConfirm" class="key go" onclick="confirmHuman()">Retirar</button>
    </div>
</div>

<div id="deathFlash"></div>
<div id="death">
    <h1 id="deathText">PERDISTE</h1>
    <button id="deathBtn" class="btn-main" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i> Volver a intentar</button>
</div>

<div id="modal">
    <div id="modalBox">
        <div id="resultIcon"></div>
        <h2 id="resultTitle"></h2>
        <p id="resultMsg"></p>
        <button class="btn-main" style="padding:13px;font-size:14px" onclick="closeModalAndReset()">Jugar de nuevo</button>
    </div>
</div>

<script>
/* =====================================================================
   LÓGICA DEL JUEGO (misma que la versión 2D: Minimax + Misère)
   ===================================================================== */
const ROLE_MAX = 'ai';
const ROLE_MIN = 'human';

let currentMatches = 21;
let initialMatches = 21;
let currentPlayer = ROLE_MAX;
let firstPlayerChoice = 'random';
let isGameOver = false;
let isAiThinking = false;
let busy = false;          // hay una animación de retiro en curso
let gameId = 0;            // invalida timeouts de partidas anteriores

const minimaxCache = new Map();

const $ = id => document.getElementById(id);
const cantInitialInput = $('cantInitialInput');
const aiDifficultySelect = $('aiDifficulty');

function minimax(state, isMaxTurn) {
    if (state === 0) return isMaxTurn ? 1 : -1;
    const key = `${state}_${isMaxTurn}`;
    if (minimaxCache.has(key)) return minimaxCache.get(key);
    const moves = [1, 2, 3].filter(m => m <= state);
    let best = isMaxTurn ? -Infinity : Infinity;
    for (const mv of moves) {
        const v = minimax(state - mv, !isMaxTurn);
        best = isMaxTurn ? Math.max(best, v) : Math.min(best, v);
    }
    minimaxCache.set(key, best);
    return best;
}

function getAIDecision(state) {
    const available = [1, 2, 3].filter(m => m <= state);
    const difficulty = aiDifficultySelect.value;
    let errorProbability = 0;
    if (difficulty === 'easy') errorProbability = 0.50;
    else if (difficulty === 'medium') errorProbability = 0.20;

    if (Math.random() < errorProbability && available.length > 1) {
        return available[Math.floor(Math.random() * available.length)];
    }

    let bestValue = -Infinity;
    let candidates = [];
    for (const mv of available) {
        const v = minimax(state - mv, false);
        if (v > bestValue) { bestValue = v; candidates = [mv]; }
        else if (v === bestValue) candidates.push(mv);
    }

    if (bestValue <= 0) {
        const remainder = (state - 1) % 4;
        if (remainder > 0 && remainder <= 3) return remainder;
        return available[Math.floor(Math.random() * available.length)];
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
}

/* =====================================================================
   ESCENA 3D
   ===================================================================== */
const L = 3.0;          // largo del fósforo
const R = 0.065;        // radio del palo
const PITCH = 0.27;     // separación lateral
const ROWP = 3.6;       // separación entre filas

const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070b);
scene.fog = new THREE.Fog(0x07070b, 45, 130);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
camera.position.set(0, 9, 9);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.06;
controls.minDistance = 3;
controls.maxDistance = 90;
controls.enablePan = false;
let userMovedCamera = false;
controls.addEventListener('start', () => { userMovedCamera = true; });

/* ---------- Texturas procedurales ---------- */
function canvasTex(w, h, draw, srgb = true) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
}

const tableTex = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#3a2212'; g.fillRect(0, 0, w, h);
    const planks = 6, ph = h / planks;
    for (let p = 0; p < planks; p++) {
        const y0 = p * ph, tone = Math.random() * 22 - 11;
        g.fillStyle = `rgb(${78 + tone},${46 + tone * .6},${24 + tone * .4})`;
        g.fillRect(0, y0, w, ph);
        for (let i = 0; i < 160; i++) {
            const y = y0 + Math.random() * ph, a = Math.random() * .18;
            g.strokeStyle = Math.random() < .55 ? `rgba(20,10,4,${a})` : `rgba(170,115,70,${a * .7})`;
            g.lineWidth = Math.random() * 2 + .4;
            g.beginPath(); g.moveTo(0, y);
            for (let x = 0; x <= w; x += 48) g.lineTo(x, y + Math.sin(x * .012 + i) * 2.6 + (Math.random() - .5) * 1.2);
            g.stroke();
        }
        // nudo ocasional
        if (Math.random() < .6) {
            const kx = Math.random() * w, ky = y0 + ph / 2;
            for (let r = 3; r < 22; r += 3) {
                g.strokeStyle = `rgba(25,12,5,${.35 - r * .012})`; g.lineWidth = 1.4;
                g.beginPath(); g.ellipse(kx, ky, r * 2.2, r * .8, 0, 0, Math.PI * 2); g.stroke();
            }
        }
        g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, y0, w, 3);
    }
});
tableTex.wrapS = tableTex.wrapT = THREE.RepeatWrapping;
tableTex.repeat.set(3, 2.4);

const matchTex = canvasTex(128, 256, (g, w, h) => {
    for (let x = 0; x < w; x++) {
        const edge = Math.pow(Math.abs(x / w - .5) * 2, 3);
        const t = 232 - edge * 55 + (Math.random() - .5) * 16;
        g.fillStyle = `rgb(${t},${t * .86},${t * .6})`;
        g.fillRect(x, 0, 1, h);
    }
    for (let i = 0; i < 120; i++) {
        g.fillStyle = `rgba(120,80,40,${Math.random() * .18})`;
        g.fillRect(Math.random() * w, Math.random() * h, Math.random() * 1.6 + .3, Math.random() * 60 + 10);
    }
});

const flameTex = canvasTex(64, 128, (g, w, h) => {
    const grd = g.createRadialGradient(w / 2, h * .72, 2, w / 2, h * .66, h * .55);
    grd.addColorStop(0, 'rgba(255,250,200,1)');
    grd.addColorStop(.25, 'rgba(255,190,60,.95)');
    grd.addColorStop(.6, 'rgba(255,90,10,.5)');
    grd.addColorStop(1, 'rgba(255,40,0,0)');
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(w / 2, 4);
    g.bezierCurveTo(w * .95, h * .45, w * .95, h * .9, w / 2, h * .96);
    g.bezierCurveTo(w * .05, h * .9, w * .05, h * .45, w / 2, 4);
    g.fill();
}, false);

/* ---------- Iluminación ---------- */
const hemi = new THREE.HemisphereLight(0x8aa0c8, 0x1a1008, 0.28);
scene.add(hemi);

const lamp = new THREE.SpotLight(0xffe2b0, 1.9, 0, 0.62, 0.65, 1);
lamp.position.set(0, 20, 7);
lamp.castShadow = true;
lamp.shadow.mapSize.set(2048, 2048);
lamp.shadow.bias = -0.0004;
lamp.shadow.radius = 4;
lamp.shadow.camera.near = 6;
lamp.shadow.camera.far = 70;
scene.add(lamp, lamp.target);

const rim = new THREE.DirectionalLight(0x6f8fff, 0.35);
rim.position.set(-14, 8, -14);
scene.add(rim);

const flameLight = new THREE.PointLight(0xff9a3c, 0, 9, 2);
scene.add(flameLight);

/* ---------- Mesa, suelo y decoración ---------- */
const table = new THREE.Mesh(
    new THREE.BoxGeometry(64, 1.4, 50),
    new THREE.MeshStandardMaterial({ map: tableTex, bumpMap: tableTex, bumpScale: 1.2, roughness: .62, metalness: 0 })
);
table.position.y = -0.7;
table.receiveShadow = true;
scene.add(table);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x0b0a0d, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -12;
scene.add(floor);

// Cajita de fósforos decorativa
const matchbox = new THREE.Group();
(function buildBox() {
    const labelTex = canvasTex(512, 256, (g, w, h) => {
        g.fillStyle = '#b3201a'; g.fillRect(0, 0, w, h);
        g.fillStyle = '#f4d35e'; g.fillRect(24, 24, w - 48, h - 48);
        g.fillStyle = '#b3201a'; g.fillRect(34, 34, w - 68, h - 68);
        g.fillStyle = '#f9e9b8'; g.textAlign = 'center';
        g.font = '900 64px sans-serif'; g.fillText('FÓSFOROS', w / 2, h / 2 + 6);
        g.font = '600 26px sans-serif'; g.fillText('★ SEGURIDAD ★', w / 2, h / 2 + 52);
        g.font = '40px sans-serif'; g.fillText('🔥', w / 2, 82);
    });
    const strike = new THREE.MeshStandardMaterial({ color: 0x2a1a12, roughness: 1 });
    const red = new THREE.MeshStandardMaterial({ color: 0xa91e18, roughness: .8 });
    const cover = new THREE.Mesh(new THREE.BoxGeometry(2.6, .7, 1.6),
        [red, red, new THREE.MeshStandardMaterial({ map: labelTex, roughness: .75 }), red, strike, strike]);
    cover.position.set(.25, .35, 0);
    const tray = new THREE.Mesh(new THREE.BoxGeometry(1.2, .55, 1.45),
        new THREE.MeshStandardMaterial({ color: 0xd9c08a, roughness: .9 }));
    tray.position.set(-1.4, .28, 0);
    [cover, tray].forEach(m => { m.castShadow = true; m.receiveShadow = true; matchbox.add(m); });
})();
scene.add(matchbox);

/* ---------- Fósforos ---------- */
const bodyGeo = new THREE.CylinderGeometry(R, R * .97, L, 14, 1);
bodyGeo.rotateX(Math.PI / 2);                 // eje largo sobre Z
const headGeo = new THREE.SphereGeometry(R * 1.5, 20, 14);
const hitGeo = new THREE.BoxGeometry(PITCH * .95, .3, L + .3);
const hitMat = new THREE.MeshBasicMaterial({ visible: false });

let matches = [];
let hoveredMatch = null;
let selected = [];
let layoutInfo = { cols: 7, rows: 3 };

function createMatch() {
    const group = new THREE.Group();
    group.rotation.order = 'YXZ';

    const bodyMat = new THREE.MeshStandardMaterial({ map: matchTex, roughness: .6, metalness: 0 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true; body.receiveShadow = true;

    const headMat = new THREE.MeshStandardMaterial({ color: 0xb3130f, roughness: .42, metalness: .05, emissive: 0x000000 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.scale.set(1, 1, 1.5);
    head.position.z = L / 2 + R * .6;
    head.castShadow = true;

    const flame = new THREE.Sprite(new THREE.SpriteMaterial({
        map: flameTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false
    }));
    flame.center.set(.5, .1);
    flame.position.set(0, R * 1.6, L / 2 + R * .6);
    flame.scale.set(.42, .7, 1);
    flame.visible = false;

    const hit = new THREE.Mesh(hitGeo, hitMat);

    group.add(body, head, flame, hit);
    const m = { group, body, head, flame, hit, bodyMat, headMat,
        selected: false, hovered: false, removing: false, spawned: false,
        lift: 0, t0: 0, spawnAt: 0, tx: 0, tz: 0, ry: 0, seed: Math.random() * 10 };
    hit.userData.match = m;
    return m;
}

function disposeMatch(m) {
    scene.remove(m.group);
    m.bodyMat.dispose(); m.headMat.dispose(); m.flame.material.dispose();
}

function buildMatches(n) {
    matches.forEach(disposeMatch);
    matches = []; selected = []; hoveredMatch = null;

    const cols0 = Math.ceil(Math.sqrt(n * 4));
    const rows = Math.ceil(n / cols0);
    const cols = Math.ceil(n / rows);
    layoutInfo = { cols, rows };

    const now = performance.now();
    for (let i = 0; i < n; i++) {
        const m = createMatch();
        const r = Math.floor(i / cols), c = i % cols;
        const inRow = Math.min(cols, n - r * cols);
        m.tx = (c - (inRow - 1) / 2) * PITCH + (Math.random() - .5) * .05;
        m.tz = (r - (rows - 1) / 2) * ROWP + (Math.random() - .5) * .3;
        m.ry = (Math.random() < .5 ? 0 : Math.PI) + (Math.random() - .5) * .07;
        m.group.position.set(m.tx, 5 + Math.random() * 3, m.tz);
        m.group.rotation.y = m.ry + (Math.random() - .5) * .8;
        m.group.rotation.x = (Math.random() - .5) * .5;
        m.group.visible = false;
        m.spawnAt = now + 120 + Math.min(i * 22, 1400) + Math.random() * 120;
        scene.add(m.group);
        matches.push(m);
    }
    fitCamera(true);
}

function fitCamera(animate) {
    const { cols, rows } = layoutInfo;
    const W = cols * PITCH + 3.5, D = rows * ROWP + 1.5;
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const tanH = tanV * camera.aspect;
    const elev = THREE.MathUtils.degToRad(52);
    const dist = Math.max(W / 2 / tanH, (D * Math.sin(elev) / 2 + .8) / tanV, 6) * 1.32;

    camGoal.pos.set(0, Math.sin(elev) * dist, Math.cos(elev) * dist);
    camGoal.target.set(0, 0, 0);
    camGoal.active = true;
    userMovedCamera = false;
    if (!animate) { camera.position.copy(camGoal.pos); controls.target.copy(camGoal.target); }

    lamp.position.set(0, Math.max(20, dist * 1.05), Math.max(5, dist * .25));
    lamp.target.position.set(0, 0, 0);
    lamp.angle = Math.min(1.0, Math.atan((Math.max(W, D) * .75) / lamp.position.y) + .12);

    matchbox.position.set(Math.min(W / 2 + 3.2, 24), 0, Math.min(D / 2 + 1.2, 18));
    matchbox.rotation.y = -.35;
}
const camGoal = { pos: new THREE.Vector3(0, 9, 9), target: new THREE.Vector3(), active: false };

/* ---------- Selección e interacción ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downPos = null;

function canInteract() {
    return currentPlayer === ROLE_MIN && !isGameOver && !busy && !isAiThinking;
}

function setMouse(e) {
    const r = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function pickMatch() {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(
        matches.filter(m => m.spawned && !m.removing).map(m => m.hit), false);
    return hits.length ? hits[0].object.userData.match : null;
}

canvas.addEventListener('pointermove', e => {
    if (e.buttons) return;
    setMouse(e);
    hoveredMatch = canInteract() ? pickMatch() : null;
    canvas.style.cursor = hoveredMatch ? 'pointer' : 'grab';
});
canvas.addEventListener('pointerleave', () => { hoveredMatch = null; });
canvas.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointerup', e => {
    canvas.style.cursor = 'grab';
    if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < 6 && canInteract()) {
        setMouse(e);
        const m = pickMatch();
        if (m) toggleSelect(m);
    }
    downPos = null;
});
window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Enter') confirmHuman();
    if (e.key === 'Escape') clearSelection();
});

function toggleSelect(m) {
    if (m.selected) {
        m.selected = false;
        selected = selected.filter(s => s !== m);
    } else {
        const maxSel = Math.min(3, currentMatches);
        if (selected.length >= maxSel) { flashHint('Solo podés elegir hasta 3 fósforos'); return; }
        m.selected = true;
        selected.push(m);
    }
    updateActions();
}

function clearSelection() {
    selected.forEach(m => { m.selected = false; });
    selected = [];
    updateActions();
}

function flashHint(text) {
    const h = $('hint');
    h.textContent = text; h.style.color = '#fbbf24';
    setTimeout(updateActions, 1400);
}

function updateActions() {
    const mine = canInteract();
    const n = selected.length;
    $('btnConfirm').disabled = !(mine && n >= 1);
    $('btnClear').disabled = !(mine && n >= 1);
    $('btnConfirm').textContent = n ? `Retirar ${n} ${n === 1 ? 'fósforo' : 'fósforos'}` : 'Retirar';
    const h = $('hint');
    h.style.color = '';
    if (isGameOver) h.textContent = 'Partida terminada';
    else if (currentPlayer === ROLE_MAX) h.textContent = 'La IA está pensando…';
    else if (busy) h.textContent = '…';
    else if (!n) h.textContent = 'Tocá de 1 a 3 fósforos para elegirlos';
    else h.textContent = `${n} elegido${n === 1 ? '' : 's'} · confirmá con el botón o Enter`;
}

/* ---------- Geometría ---------- */
function lump(g, amp, freq, seed) {                 // desplaza vértices con ruido → músculos / deformidades
    const p = g.attributes.position, n = g.attributes.normal;
    for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        const d = (Math.sin(x * freq + seed) * Math.sin(y * freq * 1.3 + seed * 2) * Math.sin(z * freq * .9 + seed * 3)
            + .5 * Math.sin(x * freq * 2.7 + z * freq * 2.1 + seed) * Math.cos(y * freq * 2.3)) * amp;
        p.setXYZ(i, x + n.getX(i) * d, y + n.getY(i) * d, z + n.getZ(i) * d);
    }
    p.needsUpdate = true;
}
function blob(rx, ry, rz, amp = .1, freq = 2.2, seed = 0) {
    const g = new THREE.SphereGeometry(1, 32, 24);
    g.rotateY(-Math.PI / 2);                         // la costura queda atrás
    lump(g, amp, freq, seed);
    g.scale(rx, ry, rz);
    g.computeVertexNormals();
    return g;
}
function limbGeo(rt, rb, h) {
    const g = new THREE.CylinderGeometry(rt, rb, h, 16, 6, true);
    lump(g, .08, 2.0, Math.random() * 5);
    g.computeVertexNormals();
    return g;
}
const mk = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const UP = new THREE.Vector3(0, 1, 0);

function segment(a, b, r0, r1, mat) {
    const dir = new THREE.Vector3().subVectors(b, a), len = dir.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 12), mat);
    m.position.copy(a).addScaledVector(dir, .5);
    m.quaternion.setFromUnitVectors(UP, dir.normalize());
    return m;
}
function makeHorn(side) {
    const pts = [[.75, 1.1, .1], [1.25, 1.8, -.05], [1.75, 2.6, 0], [2.0, 3.4, .35], [1.75, 4.1, .95]]
        .map(p => new THREE.Vector3(p[0] * side, p[1], p[2]));
    const curve = new THREE.CatmullRomCurve3(pts), g = new THREE.Group(), N = 14;
    let prev = curve.getPoint(0);
    for (let i = 1; i <= N; i++) {
        const u = i / N, p = curve.getPoint(u);
        const r0 = .3 * (1 - (i - 1) / N) + .02, r1 = .3 * (1 - u) + .015;
        g.add(segment(prev, p, r0, r1, hornMat));
        g.add(mk(new THREE.SphereGeometry(r1, 10, 8), hornMat, p.x, p.y, p.z));
        prev = p;
    }
    return g;
}
function fang(len, r, down) {
    const geo = new THREE.ConeGeometry(r, len, 8);
    if (down) { geo.rotateX(Math.PI); geo.translate(0, -len / 2, 0); } else geo.translate(0, len / 2, 0);
    return new THREE.Mesh(geo, toothMat);
}
function toothArc(parent, cx, y, cz, rx, rz, down) {
    for (let i = 0; i <= 10; i++) {
        const a = -1.25 + i * .25, big = (i === 2 || i === 8);
        const t = fang(big ? .85 : .25 + Math.random() * .22, big ? .12 : .075, down);
        t.position.set(cx + Math.sin(a) * rx, y, cz + Math.cos(a) * rz);
        t.rotation.z = (Math.random() - .5) * .12;
        parent.add(t);
    }
}

function buildArm(side) {
    const shoulder = new THREE.Group(); shoulder.position.set(side * 2.7, 8.4, 0);
    const upper = mk(limbGeo(.62, .48, 2.6), skinMat, 0, -1.3, 0);
    const elbow = new THREE.Group(); elbow.position.y = -2.6;
    const fore = mk(limbGeo(.46, .34, 2.6), skinMat, 0, -1.3, 0);
    const hand = new THREE.Group(); hand.position.y = -2.6;
    hand.add(mk(blob(.42, .5, .22, .05, 3, 2), skinMat, 0, -.2, 0));
    for (let i = 0; i < 4; i++) {
        const f = new THREE.Group();
        f.position.set((i - 1.5) * .2, -.4, 0);
        f.rotation.z = (i - 1.5) * .18; f.rotation.x = -.15;
        f.add(mk(new THREE.CylinderGeometry(.07, .05, .55, 8), skinMat, 0, -.27, 0));
        const claw = new THREE.Mesh(new THREE.ConeGeometry(.06, .55, 8), clawMat);
        claw.rotation.x = Math.PI; claw.position.y = -.82;
        f.add(claw); hand.add(f);
    }
    elbow.add(mk(blob(.5, .5, .5, .06, 3, side), skinMat), fore, hand);
    shoulder.add(mk(blob(1.1, 1.0, 1.0, .1, 2.4, side + 2), skinMat), upper, elbow);
    for (let k = 0; k < 2; k++) {                    // pinchos del hombro
        const sp = new THREE.Mesh(new THREE.ConeGeometry(.22, 1.1 - k * .3, 8), hornMat);
        sp.position.set(side * (.3 + k * .55), .95 - k * .15, -.2);
        sp.rotation.z = -side * (.35 + k * .4);
        shoulder.add(sp);
    }
    return { group: shoulder, elbow };
}

function buildDemon() {
    const demon = new THREE.Group();
    const P = {};
    P.torso = new THREE.Group();
    P.torso.add(mk(blob(2.3, 3.0, 1.6, .1, 2.4, 1), skinMat, 0, 6.4, 0),
        mk(blob(1.7, 1.5, 1.2, .08, 2.6, 4), skinMat, 0, 4.2, .15),
        mk(blob(1.6, .9, 1.2, .06, 2.6, 5), skinMat, 0, 3.0, 0),
        mk(blob(1.6, .9, 1.0, .08, 2.4, 6), skinMat, 0, 8.9, -.3),     // hombros / trapecio
        mk(blob(1.0, .8, .6, .05, 3, 7), skinMat, -1.0, 7.7, 1.1),     // pectorales
        mk(blob(1.0, .8, .6, .05, 3, 8), skinMat, 1.0, 7.7, 1.1));
    demon.add(P.torso);

    [-1, 1].forEach(s => {                           // piernas
        demon.add(mk(limbGeo(.95, .6, 3.2), skinMat, s * 1.0, 1.6, 0));
        demon.add(mk(blob(.7, .3, 1.0, .05, 3, s), skinMat, s * 1.05, .2, .5));
        for (let k = -1; k <= 1; k++) {
            const c = new THREE.Mesh(new THREE.ConeGeometry(.1, .6, 8), clawMat);
            c.rotation.x = Math.PI / 2; c.position.set(s * 1.05 + k * .3, .2, 1.4);
            demon.add(c);
        }
    });

    const armR = buildArm(1), armL = buildArm(-1);
    demon.add(armR.group, armL.group);
    P.arms = [armR, armL];

    demon.add(mk(new THREE.CylinderGeometry(.85, 1.1, 2.4, 20, 1, true), skinMat, 0, 9.6, .15));

    const head = new THREE.Group(); head.position.set(0, 10.6, .4);
    head.add(mk(blob(1.35, 1.6, 1.4, .1, 2.2, 3), skinMat, 0, .2, 0));
    head.add(mk(blob(.75, .6, .8, .05, 3, 9), skinMat, 0, -.35, 1.2));            // hocico
    head.add(mk(blob(.75, .2, .9, .02, 3, 1), gumMat, 0, -.9, 1.0));              // paladar
    head.add(mk(blob(.6, .6, .3, 0), throatMat, 0, -1.0, .3));                    // garganta
    P.glows = [];
    [-1, 1].forEach(s => {
        const brow = mk(blob(.8, .3, .65, .05, 3, s + 3), skinMat, s * .62, .74, 1.0);
        brow.rotation.z = s * .38; head.add(brow);
        head.add(mk(blob(.36, .3, .3, .02, 3, 1), darkMat, s * .6, .3, .98));      // órbita
        const eg = new THREE.Group(); eg.position.set(s * .6, .3, 1.2); eg.rotation.z = s * .35;
        const ball = mk(new THREE.SphereGeometry(.2, 16, 12), eyeMat); ball.scale.set(1.15, .7, .85);
        eg.add(ball, mk(new THREE.BoxGeometry(.05, .3, .02), pupilMat, 0, 0, .175));
        head.add(eg);
        const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff6a10, blending: THREE.AdditiveBlending,
            transparent: true, depthWrite: false, opacity: 0, fog: false }));
        gl.scale.set(1.7, 1.7, 1); gl.position.set(s * .6, .3, 1.55);
        head.add(gl); P.glows.push(gl);
        head.add(mk(blob(.07, .1, .07, 0), darkMat, s * .2, -.2, 1.95));           // fosas nasales
        const ear = new THREE.Mesh(new THREE.ConeGeometry(.35, 1.4, 10), skinMat);
        ear.position.set(s * 1.45, .4, -.1); ear.rotation.z = -s * 1.25; ear.scale.z = .5;
        head.add(ear, makeHorn(s));
    });
    toothArc(head, 0, -.85, 1.2, .68, .7, true);

    P.jaw = new THREE.Group(); P.jaw.position.set(0, -.75, .55);                  // mandíbula con bisagra
    P.jaw.add(mk(blob(.75, .3, .85, .05, 3, 11), skinMat, 0, -.1, .75));
    P.jaw.add(mk(blob(.35, .09, .8, 0), tongueMat, 0, -.02, .6));
    const chin = new THREE.Mesh(new THREE.ConeGeometry(.2, .9, 8), hornMat);
    chin.position.set(0, -.45, 1.45); chin.rotation.x = Math.PI + .3; P.jaw.add(chin);
    toothArc(P.jaw, 0, .05, .7, .6, .65, false);
    head.add(P.jaw);
    P.head = head; demon.add(head);

    P.back = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xaa1000, blending: THREE.AdditiveBlending,
        transparent: true, depthWrite: false, opacity: 0, fog: false }));
    P.back.scale.set(28, 28, 1); P.back.position.set(0, 7.5, -3);
    demon.add(P.back);

    demon.visible = false;
    return { demon, P };
}

const EMB = 180;                                     // brasas flotantes
const embGeo = new THREE.BufferGeometry();
const embPos = new Float32Array(EMB * 3), embVel = new Float32Array(EMB);
embGeo.setAttribute('position', new THREE.BufferAttribute(embPos, 3));
const embers = new THREE.Points(embGeo, new THREE.PointsMaterial({ color: 0xff6a20, size: .16, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false }));
embers.frustumCulled = false; embers.visible = false;
scene.add(embers);

/* ---------- Sonido (sintetizado, sin archivos) ---------- */
let audioCtx = null, deathAudio = null;
function deathSound() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const ctx = audioCtx, t0 = ctx.currentTime, end = t0 + T_CUT;
        const master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(master);
        const dg = ctx.createGain(); dg.gain.setValueAtTime(0, t0); dg.gain.linearRampToValueAtTime(.55, t0 + 3.5); dg.connect(lp);
        [38, 57].forEach(f => {                      // zumbido grave que sube
            const o = ctx.createOscillator(); o.type = 'sawtooth';
            o.frequency.setValueAtTime(f, t0); o.frequency.linearRampToValueAtTime(f * 1.8, t0 + T_CUT);
            o.connect(dg); o.start(t0); o.stop(end);
        });
        const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = nb.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
        bp.frequency.setValueAtTime(250, t0 + T_ROAR); bp.frequency.exponentialRampToValueAtTime(1500, t0 + T_CUT - .3);
        const ng = ctx.createGain(); ng.gain.setValueAtTime(0, t0 + T_ROAR);
        ng.gain.linearRampToValueAtTime(.9, t0 + T_ROAR + .6); ng.gain.linearRampToValueAtTime(1.3, t0 + T_CUT - .15);
        ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start(t0); ns.stop(end);
        const gr = ctx.createOscillator(); gr.type = 'sawtooth';                  // gruñido con trémolo
        gr.frequency.setValueAtTime(70, t0 + T_ROAR); gr.frequency.exponentialRampToValueAtTime(240, t0 + T_CUT - .3);
        const grg = ctx.createGain(); grg.gain.setValueAtTime(0, t0 + T_ROAR - .2); grg.gain.linearRampToValueAtTime(.45, t0 + T_ROAR + .6);
        const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 28; lg.gain.value = .35;
        lfo.connect(lg); lg.connect(grg.gain);
        gr.connect(grg); grg.connect(master); gr.start(t0); gr.stop(end); lfo.start(t0); lfo.stop(end);
        const th = ctx.createOscillator(), thg = ctx.createGain();                // golpe seco al cortar
        th.frequency.setValueAtTime(60, end); th.frequency.exponentialRampToValueAtTime(22, end + .4);
        thg.gain.setValueAtTime(0, t0); thg.gain.setValueAtTime(1, end); thg.gain.exponentialRampToValueAtTime(.001, end + .45);
        th.connect(thg); thg.connect(master); th.start(end); th.stop(end + .5);
        deathAudio = { ctx, master };
    } catch (e) { deathAudio = null; }
}
function stopDeathSound() {
    if (!deathAudio) return;
    try { deathAudio.master.gain.cancelScheduledValues(0); deathAudio.master.gain.setTargetAtTime(0, deathAudio.ctx.currentTime, .03); } catch (e) {}
    deathAudio = null;
}

/* ---------- Secuencia ---------- */
const T_LOOK = 1.4, T_ROAR = 3.9, T_LUNGE = 5.0, T_CUT = 5.85, T_TEXT = 7.2, T_BTN = 8.6;
const death = { active: false, blacked: false, t0: 0, H0: null, textOn: false, btnOn: false,
    sPos: new THREE.Vector3(), sTgt: new THREE.Vector3(), base: { lamp: 1.9, hemi: .28, rim: .35 } };
const POSE_LOW = new THREE.Vector3(0, 2.4, 11), LOOK_TABLE = new THREE.Vector3(0, .6, 0), LOOK_DEMON = new THREE.Vector3(0, 8.4, -14);
const clamp01 = x => Math.min(1, Math.max(0, x));

function startDeath() {
    if (death.active) return;
    death.active = true; death.blacked = false; death.t0 = performance.now();
    death.H0 = null; death.textOn = death.btnOn = false;
    death.sPos.copy(camera.position); death.sTgt.copy(controls.target);
    death.base = { lamp: lamp.intensity, hemi: hemi.intensity, rim: rim.intensity };
    controls.enabled = false; camGoal.active = false;
    document.body.classList.add('cine');
    demon.visible = true; embers.visible = true;
    demon.position.set(0, -16, -14); demon.rotation.set(0, 0, 0);
    for (let i = 0; i < EMB; i++) {
        embPos[i * 3] = (Math.random() - .5) * 18; embPos[i * 3 + 1] = Math.random() * 16; embPos[i * 3 + 2] = -14 + (Math.random() - .5) * 10;
        embVel[i] = .8 + Math.random() * 1.8;
    }
    const d = $('death'); d.style.transition = 'none'; d.style.opacity = 0; d.style.pointerEvents = 'none';
    $('deathText').classList.remove('show'); $('deathBtn').classList.remove('show');
    deathSound();
}

function stopDeath() {
    if (!death.active) return;
    death.active = false; death.blacked = false;
    demon.visible = false; embers.visible = false;
    demonKey.intensity = demonRim.intensity = 0;
    lamp.intensity = death.base.lamp; hemi.intensity = death.base.hemi; rim.intensity = death.base.rim;
    camera.fov = 38; camera.updateProjectionMatrix();
    scene.fog.near = 45; scene.fog.far = 130;
    camera.position.copy(death.sPos); controls.target.copy(death.sTgt);
    controls.enabled = true;
    document.body.classList.remove('cine');
    const d = $('death'); d.style.transition = ''; d.style.opacity = 0; d.style.pointerEvents = 'none';
    $('deathFlash').style.opacity = 0;
    $('deathText').classList.remove('show'); $('deathBtn').classList.remove('show');
    stopDeathSound();
}

function updateDeath(now, dt) {
    const t = (now - death.t0) / 1000;

    if (death.blacked) {                             // pantalla negra + cartel
        if (t > T_TEXT && !death.textOn) { death.textOn = true; $('deathText').classList.add('show'); }
        if (t > T_BTN && !death.btnOn) { death.btnOn = true; $('deathBtn').classList.add('show'); }
        return;
    }

    /* luces ambientales: la sala se apaga */
    const dim = smooth(t / 1.3), fl = t < T_ROAR ? .8 + Math.random() * .4 : 1;
    lamp.intensity = death.base.lamp * (1 - dim * .9) * fl;
    hemi.intensity = death.base.hemi * (1 - dim * .8);
    rim.intensity = death.base.rim * (1 - dim);

    const rise = 1 - Math.pow(1 - clamp01((t - 1.6) / 2.1), 3);
    const roar = smooth((t - T_ROAR) / .5);
    const u = clamp01((t - T_LUNGE) / (T_CUT - T_LUNGE - .05));
    const ease = Math.pow(u, 2.2);
    const tgt = new THREE.Vector3(), pos = new THREE.Vector3();

    /* cámara: baja a la mesa, se levanta y mira hacia arriba */
    if (t < T_LOOK) {
        const e = smooth(t / T_LOOK);
        pos.lerpVectors(death.sPos, POSE_LOW, e); tgt.lerpVectors(death.sTgt, LOOK_TABLE, e);
    } else if (t < T_ROAR) {
        const e = smooth((t - T_LOOK) / (T_ROAR - T_LOOK));
        pos.set(0, 2.4 + 1.9 * e, 11); tgt.lerpVectors(LOOK_TABLE, LOOK_DEMON, e);
    } else {
        pos.set(0, 4.3, 11 + Math.min(t - T_ROAR, T_LUNGE - T_ROAR) * .25); tgt.copy(LOOK_DEMON);
    }

    /* demonio */
    if (t < T_LUNGE) {
        demon.position.set((Math.random() - .5) * .14 * (1 - rise), -16 * (1 - rise), -14);
        demon.rotation.x = 0;
    } else {
        if (!death.H0) {
            demon.updateMatrixWorld(true);
            death.H0 = DP.head.getWorldPosition(new THREE.Vector3());
            death.H1 = new THREE.Vector3(0, 4.3, pos.z - 1.9);
        }
        demon.rotation.x = .55 * ease;
        const goal = new THREE.Vector3().lerpVectors(death.H0, death.H1, ease);
        demon.updateMatrixWorld(true);
        demon.position.add(goal.sub(DP.head.getWorldPosition(new THREE.Vector3())));
        tgt.lerpVectors(LOOK_DEMON, death.H1, ease);
    }
    DP.jaw.rotation.x = roar * .8 + ease * .45 + Math.sin(t * 40) * .03 * roar;
    DP.head.rotation.x = -.35 * roar + .25 * ease;
    DP.head.rotation.y = Math.sin(t * 1.3) * .08 * rise;
    DP.head.position.x = (Math.random() - .5) * .06 * roar;
    DP.torso.scale.y = 1 + Math.sin(t * 2.2) * .012;
    const armPose = smooth((t - 4.0) / .8);
    DP.arms.forEach((a, i) => {
        const s = i === 0 ? 1 : -1;
        a.group.rotation.x = -(armPose * .6 + ease * 1.0);
        a.group.rotation.z = s * (.3 - .15 * ease);
        a.elbow.rotation.x = -(armPose * .3 + ease * .3);
    });
    skinMat.emissiveIntensity = .3 + .2 * Math.sin(t * 3) + (roar + ease) * .25;

    const eb = smooth((t - 2.9) / .5) * (.85 + .15 * Math.random());
    eyeMat.color.setRGB(eb, .62 * eb, .05 * eb);
    DP.glows.forEach(g => { g.material.opacity = eb * .9; });
    DP.back.material.opacity = .4 * rise;

    demonKey.position.set(demon.position.x, 5, demon.position.z + 9);
    demonKey.intensity = 1.3 * smooth((t - 1.7) / 1.4) * (.8 + Math.random() * .4) * (1 + ease * 1.2);
    demonRim.position.set(demon.position.x, 13, demon.position.z - 7);
    demonRim.intensity = 2.6 * smooth((t - 1.7) / 1.4);
    scene.fog.near = 45 - 33 * dim * (1 - ease); scene.fog.far = 130 - 82 * dim * (1 - ease);   // niebla: se ve entre sombras

    /* brasas */
    embers.material.opacity = smooth((t - 2) / 1) * .85;
    for (let i = 0; i < EMB; i++) {
        embPos[i * 3 + 1] += embVel[i] * dt;
        embPos[i * 3] += Math.sin(t * 2 + i) * .3 * dt;
        if (embPos[i * 3 + 1] > 18) embPos[i * 3 + 1] = 0;
    }
    embGeo.attributes.position.needsUpdate = true;

    /* temblor y apertura del campo de visión */
    const shake = t < 1.6 ? 0 : t < T_ROAR ? .02 : t < T_LUNGE ? .06 : .06 + .5 * ease;
    camera.position.copy(pos).add(new THREE.Vector3((Math.random() - .5) * shake, (Math.random() - .5) * shake, (Math.random() - .5) * shake));
    camera.lookAt(tgt);
    camera.rotateZ((Math.random() - .5) * shake * .2);
    const fov = 38 + 38 * ease;
    if (fov !== camera.fov) { camera.fov = fov; camera.updateProjectionMatrix(); }

    /* destello rojo y corte a negro */
    const flash = $('deathFlash');
    if (t > T_CUT - .35) flash.style.opacity = Math.min(1, (t - (T_CUT - .35)) / .15) * .9;
    if (t > T_CUT - .18) $('death').style.opacity = clamp01((t - (T_CUT - .18)) / .18);
    if (t >= T_CUT) {
        death.blacked = true;
        const d = $('death'); d.style.opacity = 1; d.style.pointerEvents = 'auto';
        flash.style.opacity = 0;
    }
}

renderer.compile(scene, camera);                     // precompila shaders para que no haya tirón al aparecer

/* ---------- Animación ---------- */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), .05);
    const now = performance.now();
    const k = 1 - Math.exp(-dt * 10);

    if (death.active) updateDeath(now, dt);
    else if (camGoal.active && !userMovedCamera) {
        const kc = 1 - Math.exp(-dt * 3);
        camera.position.lerp(camGoal.pos, kc);
        controls.target.lerp(camGoal.target, kc);
        if (camera.position.distanceTo(camGoal.pos) < .02) camGoal.active = false;
    }

    let lightPower = 0, lx = 0, ly = 0, lz = 0, lc = 0;

    for (const m of matches) {
        if (!m.spawned) {
            if (now < m.spawnAt) continue;
            m.spawned = true; m.group.visible = true;
        }
        const g = m.group;
        m.hovered = (m === hoveredMatch) && canInteract();
        const flick = .85 + Math.sin(now * .03 + m.seed * 7) * .12 + Math.sin(now * .071 + m.seed) * .08;

        if (m.removing) {
            const t = (now - m.t0) / 1000;
            const up = smooth(t / .55);
            g.position.y = R + .5 + up * 1.3;
            g.rotation.x = -up * .7;
            g.rotation.y = m.ry + t * .8;
            const burn = smooth((t - .3) / .7);
            m.bodyMat.color.setScalar(1 - burn * .88);
            m.headMat.emissive.setRGB(1, .35 + .2 * flick, .05);
            m.headMat.emissiveIntensity = 1.4;
            const fade = smooth((t - .85) / .4);
            m.bodyMat.opacity = m.headMat.opacity = 1 - fade;
            m.flame.visible = true;
            m.flame.material.opacity = (1 - fade);
            const s = (.7 + burn * .6) * flick;
            m.flame.scale.set(.5 * s, .95 * s, 1);
        } else {
            const targetLift = m.selected ? .55 : (m.hovered ? .16 : 0);
            m.lift += (targetLift - m.lift) * k;
            g.position.x += (m.tx - g.position.x) * k;
            g.position.z += (m.tz - g.position.z) * k;
            g.position.y += (R + m.lift - g.position.y) * k;
            g.rotation.y += (m.ry - g.rotation.y) * k;
            g.rotation.x += (-(m.selected ? .1 : 0) - g.rotation.x) * k;
            g.rotation.z += (0 - g.rotation.z) * k;

            m.flame.visible = m.selected;
            if (m.selected) m.flame.scale.set(.42 * flick, .72 * (2 - flick), 1);

            if (m.selected) { m.headMat.emissive.setRGB(1, .3, .04); m.headMat.emissiveIntensity = .9 * flick; }
            else if (m.hovered) { m.headMat.emissive.setRGB(.5, .12, .02); m.headMat.emissiveIntensity = 1; }
            else m.headMat.emissiveIntensity = 0;
            m.bodyMat.emissive.setRGB(m.hovered ? .12 : 0, m.hovered ? .08 : 0, 0);
        }

        if (m.selected || m.removing) {
            m.head.getWorldPosition(tmpV);
            lx += tmpV.x; ly += tmpV.y; lz += tmpV.z; lc++;
            lightPower += m.removing ? 1.4 : 1;
        }
    }

    if (lc) {
        flameLight.position.set(lx / lc, ly / lc + .7, lz / lc);
        flameLight.intensity += (Math.min(lightPower, 4) * 1.6 * (.9 + Math.random() * .2) - flameLight.intensity) * .2;
    } else flameLight.intensity *= .85;

    if (!death.active) controls.update();
    if (!death.blacked) renderer.render(scene, camera);
}

function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (!userMovedCamera) fitCamera(false);
}
window.addEventListener('resize', onResize);

/* =====================================================================
   FLUJO DE LA PARTIDA
   ===================================================================== */
function setFirstPlayer(player) {
    firstPlayerChoice = player;
    $('btnStartAI').classList.toggle('on', player === ROLE_MAX);
    $('btnStartHuman').classList.toggle('on', player === ROLE_MIN);
    $('btnStartRandom').classList.toggle('on', player === 'random');
}

function resetGame() {
    gameId++;
    stopDeath();
    let val = parseInt(cantInitialInput.value);
    if (isNaN(val) || val < 3) val = 21;
    val = Math.min(val, 300);
    cantInitialInput.value = val;

    initialMatches = val;
    currentMatches = val;
    currentPlayer = firstPlayerChoice === 'random'
        ? (Math.random() < .5 ? ROLE_MAX : ROLE_MIN) : firstPlayerChoice;
    isGameOver = false;
    isAiThinking = false;
    busy = false;

    $('initialMax').textContent = `/ ${initialMatches}`;
    $('remainingCount').textContent = currentMatches;
    const startText = currentPlayer === ROLE_MAX ? 'Empieza la IA' : 'Empezás vos';
    $('gameLog').innerHTML = `<p class="empty">Partida iniciada con ${initialMatches} fósforos (${startText})</p>`;

    $('modal').classList.remove('show');
    buildMatches(initialMatches);
    updateTurnUI();

    if (currentPlayer === ROLE_MAX) triggerAITurn(1700);
}

function confirmHuman() {
    if (!canInteract() || selected.length < 1 || selected.length > 3) return;
    const list = selected.slice();
    selected = [];
    executeMove(list, 'Vos');
}

function executeMove(list, playerTitle) {
    const gid = gameId;
    busy = true;
    const now = performance.now();
    list.forEach(m => {
        m.selected = false; m.hovered = false; m.removing = true; m.t0 = now;
        m.bodyMat.transparent = true; m.headMat.transparent = true;
    });
    hoveredMatch = null;
    logMove(playerTitle, list.length);
    updateActions();

    setTimeout(() => {
        if (gid !== gameId) return;
        list.forEach(disposeMatch);
        matches = matches.filter(m => !list.includes(m));
        currentMatches -= list.length;
        $('remainingCount').textContent = currentMatches;
        busy = false;

        if (currentMatches === 0) {
            endGame(currentPlayer === ROLE_MIN ? ROLE_MAX : ROLE_MIN);
            return;
        }
        currentPlayer = currentPlayer === ROLE_MIN ? ROLE_MAX : ROLE_MIN;
        updateTurnUI();
        if (currentPlayer === ROLE_MAX) triggerAITurn();
    }, 1300);
}

function triggerAITurn(delay = 900) {
    const gid = gameId;
    isAiThinking = true;
    updateActions();

    setTimeout(() => {
        if (gid !== gameId) return;
        const count = getAIDecision(currentMatches);
        const pool = matches.filter(m => m.spawned && !m.removing);
        const chosen = [];
        while (chosen.length < count && pool.length) {
            chosen.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        }
        // la IA "levanta" los fósforos uno a uno antes de quemarlos
        chosen.forEach((m, i) => setTimeout(() => { if (gid === gameId) m.selected = true; }, i * 280));
        setTimeout(() => {
            if (gid !== gameId) return;
            isAiThinking = false;
            executeMove(chosen, 'La IA');
        }, chosen.length * 280 + 600);
    }, delay);
}

function updateTurnUI() {
    const nb = $('nodeBadge');
    if ((currentMatches - 1) % 4 === 0) {
        nb.className = 'node-p'; nb.textContent = 'Nodo P (Posición Perdedora)';
    } else {
        nb.className = 'node-n'; nb.textContent = 'Nodo N (Posición Ganadora)';
    }
    nb.style.cssText = 'display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid';

    const badge = $('turnBadge'), card = $('status');
    card.classList.remove('glow-human', 'glow-ai');
    if (currentPlayer === ROLE_MIN) {
        badge.style.color = 'var(--blue)';
        badge.innerHTML = '<i class="fa-solid fa-user"></i><span>Tu turno</span>';
        $('subTurn').textContent = 'Elegí 1, 2 o 3 fósforos';
        card.classList.add('glow-human');
    } else {
        badge.style.color = 'var(--red)';
        badge.innerHTML = '<i class="fa-solid fa-robot fa-bounce"></i><span>Turno de la IA</span>';
        $('subTurn').textContent = 'Pensando la jugada…';
        card.classList.add('glow-ai');
    }
    updateActions();
}

function logMove(player, count) {
    const log = $('gameLog');
    if (log.querySelector('p.empty')) log.innerHTML = '';
    const p = document.createElement('p');
    const color = player === 'Vos' ? '#60a5fa' : '#f87171';
    p.innerHTML = `<b style="color:${color}">${player}:</b><span>retiró <b>${count}</b> ${count === 1 ? 'fósforo' : 'fósforos'} ${'🔥'.repeat(count)}</span>`;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
}

function endGame(winner) {
    isGameOver = true;
    updateActions();
    const gid = gameId;
    setTimeout(() => {
        if (gid !== gameId) return;
        const icon = $('resultIcon'), title = $('resultTitle'), msg = $('resultMsg');
        if (winner === ROLE_MIN) {
            icon.style.cssText = 'background:rgba(16,185,129,.2);color:#34d399;border-color:rgba(16,185,129,.4)';
            icon.innerHTML = '<i class="fa-solid fa-trophy"></i>';
            title.style.color = '#34d399'; title.textContent = '¡VICTORIA!';
            msg.textContent = '¡Lograste derrotar a la IA forzándola a tomar el último fósforo!';
            confetti({ particleCount: 140, spread: 80, origin: { y: .6 } });
            $('modal').classList.add('show');
        } else {
            startDeath();
        }
    }, 400);
}

function closeModalAndReset() {
    $('modal').classList.remove('show');
    resetGame();
}

/* ---------- Arranque ---------- */
onResize();
canvas.style.cursor = 'grab';
animate();
resetGame();
setTimeout(() => $('loading').classList.add('hide'), 300);
</script>
